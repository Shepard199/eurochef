[workspace]
resolver = "2"
members = [
  "eurochef/cli",
  "eurochef/gui",
  "eurochef/shared",
  "eurochef-edb",
  "eurochef-elx",
  "eurochef-filelist"
]

[workspace.package]
edition = "2021"
rust-version = "1.97"

[profile.dev.package.image]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2 # fast and small wasm
lto = true
