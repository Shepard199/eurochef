[package]
name = "eurochef-cli"
version = "0.1.0"
authors = ["cohaereo <cohaereo@protonmail.com>"]
edition = "2021"
rust-version = "1.97"

[[bin]]
name = "eurochef-cli"
path = "src/main.rs"

[dependencies]
eurochef-edb = { path = "../../eurochef-edb" }
eurochef-filelist = { path = "../../eurochef-filelist" }
eurochef-shared = { path = "../shared" }

anyhow = { version = "1.0.104", features = ["backtrace"] }
base64 = "0.23.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.4", features = ["derive", "color"] }
clap-num = "1.2.0"
enumn = "0.1.14"
indicatif = "0.18.6"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "tga",
] }
# apng 0.3.4 still exposes image 0.24 DynamicImage in its public API.
image_024 = { package = "image", version = "0.24.9", default-features = false }
glob = "0.3"
gltf = { version = "1.4.1", default-features = false, features = [
    "names",
    "KHR_materials_pbrSpecularGlossiness",
] }
pathdiff = "0.2.3"
qoi = "0.4.1"
serde_json = "1"
tracing = "0.1.44"
walkdir = "2.5.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
apng = "0.3.4"
serde = "1.0.229"
parse_int = "0.9.0"
serde_yaml = "0.9.34"
hex = "0.4.3"
